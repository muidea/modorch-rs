{
  "on": {
    "pull_request": {},
    "push": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "name": "Documentation and Contracts",
  "env": {
    "RUSTUP_TOOLCHAIN": "1.94.0",
    "CARGO_BUILD_JOBS": "2"
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "name": "Pinned documented toolchain",
          "run": "rustup toolchain install 1.94.0 --profile minimal"
        },
        {
          "run": "cargo fetch --locked"
        },
        {
          "name": "Behavior evidence and mapping",
          "shell": "bash",
          "run": "mkdir -p validation/docs\ncargo test --workspace --all-features --locked 2>&1 | tee validation/docs/tests.log\npython3 tools/doc-validation/run.py --results validation/docs/tests.log"
        },
        {
          "run": "cargo test --doc --workspace --all-features --locked"
        },
        {
          "run": "cargo doc --workspace --all-features --no-deps --locked",
          "env": {
            "RUSTDOCFLAGS": "-D warnings"
          }
        },
        {
          "name": "Affected files report",
          "run": "python3 tools/doc-validation/affected.py > validation/docs/affected.json"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "documentation-results",
            "path": "validation/docs/"
          }
        }
      ]
    }
  }
}
